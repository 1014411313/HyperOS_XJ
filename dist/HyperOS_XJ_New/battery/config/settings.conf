# 热炸了工具箱 电池/解容配置（battery/config/settings.conf，KEY=value）
# 来源：结构源自「电池解容工具箱 v3.9.6」（作者 听夜风1337），已按新引擎 cfg_get/cfg_set 实际消费键重写。
# 引擎按 ^KEY= 精确匹配取值，# 注释行不影响解析。

# 解容总开关：1=开（开机挂 BAA、smart_fv 压 0）0=关。默认 1
unlock=1
# 低电量锁容服务（PSS）禁用：1=解容开启时禁用 PowerSaveService（设置页“电池健康度”将不显示）0=不禁用。引擎默认 0，此处保留 1 与原值一致
pss_disable=1
# 循环伪装目标值（守护写 FG 循环计数节点），空=不干预。默认 空
cycle_fake=
# 充电功率档：inf=不限速 / fast / mid / slow / 5~119 自定义瓦数。默认 inf
power_limit=inf
# 云控屏蔽开关：1=开 0=关。默认 1
cloud_guard=1
# BAA 载荷格式：auto=按原厂文件自动探测（推荐）/ enc=强制加密 / plain=强制明文
baa_fmt=auto
# 公版 PPS 解锁：1=守护维持 pd_verifed=1，0=维持 0（改后拔插一次充电器生效）。默认 0
freepps=0
# 功率节点最小重写间隔（秒），防止驱动复位后反复写节点触发 PD 反复重协商。默认 60
cg_min_write_gap=60
# 机型代号：必须留空，安装时由 customize.sh 按 getprop 自动写入（battery.sh 机型白名单、power.sh 机型电流表使用）
dev_code=
# 关机电压 mV（放电中电压 ≤ 该值时软关机），空=关闭。默认 空
term_v=
# 背屏电池卡片开关：1=开（LSPosed 叠加模式，不改动原生背屏时钟）0=关。默认 0
rearscreen=0
# 背屏卡片背景：color:#RRGGBB / image:<绝对路径>，空=跟随主题黑底。由 xjctl rear set bg= 写入
rear_bg=
# 自适应功率爬坡器（APL）开关：1=开 0=关。默认 0
apl_enable=0
# inf 档温控总闸：电池温度 ≥ thermal_ceil（0.1℃ 单位，580=58.0℃）时把 wired_thermal_remove
# 交回驱动 DT 温控表；thermal_ceil_hyst（默认 30=3.0℃）为温度回落滞回。留空用默认。
thermal_ceil=580
thermal_ceil_hyst=30
# 在线功能基址。
# update_base：检查更新用，约定 <update_base>/latest.json。
#   例：https://raw.githubusercontent.com/<用户>/<仓库>/<分支>
# dtbo_base：在线下载 DTBO 用，约定 <dtbo_base>/dtbo/<机型>.img 与 <dtbo_base>/dtbo/index.json。
# 留空 = 关闭对应在线功能（按钮会提示未配置）。
update_base=https://raw.githubusercontent.com/1014411313/HyperOS_XJ/master
dtbo_base=https://gitee.com/xiaomirezhale/miwkjr-dtbo/raw/master

# 可选现场标定项（默认注释，去掉行首 # 生效；不填走引擎内置默认值）
# fast_w=40      # fast 档目标瓦数，默认 40
# mid_w=25       # mid 档目标瓦数，默认 25
# slow_w=10      # slow 档目标瓦数，默认 10
# max_ma=8000    # 电流安全上限 mA，默认空=按机型表
