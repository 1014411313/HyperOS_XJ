# HyperOS_XJ 电池/解容配置（battery/config/settings.conf，KEY=value）
# 来源：结构源自「电池解容工具箱 v3.9.6」（作者 听夜风1337），已按新引擎 cfg_get/cfg_set 实际消费键重写。
# 引擎按 ^KEY= 精确匹配取值，# 注释行不影响解析。

# 解容总开关：1=开（开机挂 BAA、smart_fv 压 0）0=关。默认 1
unlock=1
# 低电量锁容服务（PSS）禁用：1=解容开启时禁用 PowerSaveService（设置页“电池健康度”将不显示）0=不禁用。引擎默认 0，此处保留 1 与原值一致
pss_disable=1
# 循环伪装目标值（守护写 FG 循环计数节点），空=不干预。默认 空
cycle_fake=
# 充电功率档：inf=不限速 / fast / mid / slow / 5~119 自定义瓦数。默认 inf
power_limit=inf
# 云控屏蔽开关：1=开 0=关。默认 1
cloud_guard=1
# 公版 PPS 解锁：1=守护维持 pd_verifed=1，0=维持 0（改后拔插一次充电器生效）。默认 0
freepps=0
# 功率节点最小重写间隔（秒），防止驱动复位后反复写节点触发 PD 反复重协商。默认 60
cg_min_write_gap=60
# 机型代号：必须留空，安装时由 customize.sh 按 getprop 自动写入（battery.sh 机型白名单、power.sh 机型电流表使用）
dev_code=
# 满电电压 mV（写 constant_charge_voltage / voltage_max），空=关闭。默认 空
fv_v=
# 关机电压 mV（放电中电压 ≤ 该值时软关机），空=关闭。默认 空
term_v=
# 满电电压强制突破标记：1/0。默认 0
fv_force=0
# 背屏电池卡片开关：1=开（LSPosed 叠加模式，不改动原生背屏时钟）0=关。默认 0
rearscreen=0
# 自适应功率爬坡器（APL）开关：1=开 0=关。默认 0
apl_enable=0

# 可选现场标定项（默认注释，去掉行首 # 生效；不填走引擎内置默认值）
# fast_w=40      # fast 档目标瓦数，默认 40
# mid_w=25       # mid 档目标瓦数，默认 25
# slow_w=10      # slow 档目标瓦数，默认 10
# max_ma=8000    # 电流安全上限 mA，默认空=按机型表
