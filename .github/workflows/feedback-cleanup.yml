name: feedback cleanup

# 诊断包处理完（issue 关闭）后自动删除；另外每天清理 30 天前的遗留包。
on:
  issues:
    types: [closed]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 关闭 issue → 删除对应诊断包
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -e
          body=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq '.body')
          echo "$body" | grep -o 'feedback/[A-Za-z0-9._-]*' | sort -u | while read -r f; do
            if [ -f "$f" ]; then
              git rm -q "$f"
              echo "removed $f"
            fi
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "chore(feedback): 删除已处理诊断包 (issue #$ISSUE)"
            git push
          fi

      - name: 清理 30 天前的遗留诊断包
        if: github.event_name != 'issues'
        run: |
          set -e
          removed=0
          for f in feedback/*; do
            [ -e "$f" ] || continue
            if [ -n "$(find "$f" -mtime +30 2>/dev/null)" ]; then
              git rm -q "$f"
              removed=$((removed + 1))
            fi
          done
          if [ "$removed" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "chore(feedback): 清理 30 天前的诊断包 ($removed)"
            git push
          fi
